# This template is rendered by the boop-receiver at webhook time.
# The receiver substitutes __OWNER__, __REPO__, __NUMBER__, __SHA__, __BASE_REF__,
# __REVIEW_NUMBER__, __INSTALLATION_ID__ with values from the webhook payload
# (the installation id is resolved from the X-GitHub-Installation-ID header
# if present, otherwise from installation.id in the payload), then submits
# it as a Job. It is NOT applied directly by ArgoCD.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: boop-__OWNER__-__REPO__-__NUMBER__-__SHA7__
  namespace: dev-tools
  labels:
    app: boop
    pr-number: "__NUMBER__"
    sha: "__SHA__"
  annotations:
    boop/owner: "__OWNER__"
    boop/repo: "__REPO__"
    boop/number: "__NUMBER__"
    boop/sha: "__SHA__"
    boop/base-ref: "__BASE_REF__"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: boop
        pr-number: "__NUMBER__"
    spec:
      restartPolicy: Never
      serviceAccountName: boop-job
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: review
          image: __IMAGE__
          imagePullPolicy: Always
          env:
            - name: PR_OWNER
              value: "__OWNER__"
            - name: PR_REPO
              value: "__REPO__"
            - name: PR_NUMBER
              value: "__NUMBER__"
            - name: PR_HEAD_SHA
              value: "__SHA__"
            - name: PR_BASE_REF
              value: "__BASE_REF__"
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: boop-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_INSTALLATION_ID
              value: "__INSTALLATION_ID__"
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: boop-secrets
                  key: GITHUB_APP_PRIVATE_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: boop-secrets
                  key: OPENROUTER_API_KEY
            - name: BOOP_STATUS_COMMENT_ID
              value: __STATUS_COMMENT_ID__
            - name: BOOP_REACTION_COMMENT_ID
              value: __REACTION_COMMENT_ID__
            - name: BOOP_REVIEW_NUMBER
              value: __REVIEW_NUMBER__
            - name: BOOP_SKIP_SKILL
              value: "0"
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              cpu: 4
              memory: 6Gi
          volumeMounts:
            - name: runner-config
              readOnly: true
              mountPath: /home/opencode/.config/opencode
      volumes:
        - name: runner-config
          configMap:
            name: boop-runner-config
            items:
              - key: opencode.json
                path: opencode.json
              - key: skill-boop
                path: skills/boop/SKILL.md
              - key: skill-boop-agent-code-quality
                path: skills/boop/agents/review-code-quality.md
              - key: skill-boop-agent-design-pattern
                path: skills/boop/agents/review-design-pattern.md
              - key: skill-boop-agent-error-handling
                path: skills/boop/agents/review-error-handling.md
              - key: skill-boop-agent-readability
                path: skills/boop/agents/review-readability.md
              - key: skill-boop-agent-solid-principles
                path: skills/boop/agents/review-solid-principles.md
              - key: skill-boop-agent-test-quality
                path: skills/boop/agents/review-test-quality.md
              - key: skill-boop-agent-deep
                path: skills/boop/agents/review-deep.md
              - key: skill-gh-cli
                path: skills/gh-cli/SKILL.md
