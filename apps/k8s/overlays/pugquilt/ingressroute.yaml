# QUB-115 / QUB-134: public API surface for the boop CLI and a
# tailnet AI agent. The receiver was previously in-cluster only
# (port-forward / VPN); the CLI on a tailnet node, or an agent
# running alongside the developer, could not reach /api/* or
# /dashboard/* without a tunnel.
#
# Four surfaces, four middleware chains:
#
# 1. /webhook  — GitHub HMAC-authed, rate-limit-webhook at the
#                Ingress (QUB-134) caps the outer bound at
#                300/min with a 100 burst. The receiver's own
#                process-level limiter (M4) stays as an inner
#                guard. No body cap — GitHub's payload is the
#                largest legitimate body in the system.
# 2. /api/*    — read-only GETs are unauthenticated at the
#                receiver layer (they leak Job metadata only
#                — review_number, model, token counts). The
#                CLI hits them in a steady loop. Rate limit
#                is the protection.
#                POSTs require X-BOOP-Runner-Token; the
#                receiver already enforces it on the
#                handler. The Ingress forwards the header
#                (Traefik passes custom headers through by
#                default). Body size cap protects against
#                oversize requests.
# 3. /dashboard/* — shared-secret gate (BOOP_DASHBOARD_TOKEN)
#                enforced by the receiver. Per-user identity
#                (Cloudflare Access / OAuth) is a follow-up
#                ticket; the shared token is the bootstrap.
#
# Method-based routing splits GETs from POSTs so the body
# cap applies only where a body exists. The webhook path
# takes the rate limit but not the body cap.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: boop
  namespace: dev-tools
spec:
  entryPoints:
    - websecure
  routes:
    # GitHub webhook: HMAC-authed by the receiver, rate-limited
    # at Traefik (QUB-134). The 300/min outer bound stops a
    # hostile flood before it reaches the receiver's HMAC
    # verify; the receiver's own limiter (20 req/s) is the
    # inner guard if the Traefik limit is bypassed.
    - kind: Rule
      match: Host(`boop.qubitquilt.dev`) && PathPrefix(`/webhook`)
      middlewares:
        - name: rate-limit-webhook
      services:
        - name: boop-receiver
          port: http

    # Read-only public API: rate limit only, no body cap
    - kind: Rule
      match: (Host(`boop.qubitquilt.dev`) || Host(`api.boop.qubitquilt.dev`)) && PathPrefix(`/api/`) && Method(`GET`)
      middlewares:
        - name: rate-limit-api
      services:
        - name: boop-receiver
          port: http

    # Write API: rate limit + 64 KB body cap. Token is
    # enforced at the receiver handler (X-BOOP-Runner-Token
    # check). The Ingress forwards the header.
    - kind: Rule
      match: (Host(`boop.qubitquilt.dev`) || Host(`api.boop.qubitquilt.dev`)) && PathPrefix(`/api/`)
      middlewares:
        - name: rate-limit-api
        - name: body-limit
      services:
        - name: boop-receiver
          port: http

    # Dashboard: rate limit + body cap. Shared-secret
    # auth at the receiver (BOOP_DASHBOARD_TOKEN). Per-user
    # identity is a follow-up.
    - kind: Rule
      match: Host(`boop.qubitquilt.dev`) && PathPrefix(`/dashboard/`)
      middlewares:
        - name: rate-limit-dashboard
        - name: body-limit
      services:
        - name: boop-receiver
          port: http

  tls: {}
