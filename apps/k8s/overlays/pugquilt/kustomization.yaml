---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev-tools

resources:
  - ../../base
  - ingressroute.yaml

# Default to :latest (main HEAD). After cutting a v0.x.x tag, switch
# to :stable or a specific tag (e.g. :v0.1.0) for reproducible deployments.
images:
  - name: ghcr.io/qubitquilt/boop-receiver
    newTag: latest
  - name: ghcr.io/qubitquilt/boop-runner
    newTag: latest

labels:
  - includeSelectors: false
    pairs:
      cluster: pugquilt
