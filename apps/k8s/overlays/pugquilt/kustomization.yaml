---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev-tools

resources:
  - ../../base
  - ingressroute.yaml
  - middlewares.yaml

# Pin the receiver image to a digest. The sync-image-digests workflow
# updates this whenever a new image is pushed, so the deployed
# Deployment references the exact bytes that the most recent build
# produced. Without this, the manifest's :latest tag is a moving
# target and K8s does not roll the Deployment on a registry-only image
# change.
#
# The runner image is referenced indirectly via JOB_IMAGE in the
# boop-config ConfigMap (base/config.yaml), not as a direct image
# field, so kustomize's images: override does not reach it. Each
# review Job pulls the runner image fresh, so the rollout-on-registry-
# change problem does not apply to it; it stays pinned to :stable.
images:
  - name: ghcr.io/qubitquilt/boop-receiver
    digest: sha256:b95af1c6a4efa2ca28f926697e4465f7bf329fe883db63cea9cec81ce8273e4e

labels:
  - includeSelectors: false
    pairs:
      cluster: pugquilt
