# QUB-115 / QUB-134: Traefik middlewares for the public boop
# receiver surface. Four middlewares, all in dev-tools:
#
#   rate-limit-api       — 60 req/min per source IP on /api/*
#   rate-limit-dashboard — 30 req/min per source IP on /dashboard/*
#   rate-limit-webhook   — 300 req/min per source IP on /webhook
#   body-limit          — 64 KB request body cap
#
# The /api and /dashboard limits are different on purpose:
# the CLI hits /api in a steady loop (the dashboard data
# layer is a read-heavy surface), and a 30/min cap on /api
# would make a tailnet agent's "tail -f runs list" loop
# painful. /dashboard is human-driven and the refresh
# cadence is "every few seconds during an incident, then
# nothing"; 30/min is refresh-friendly.
#
# rate-limit-webhook is the outer bound for the GitHub
# webhook path. GitHub's normal delivery rate is bounded
# (low hundreds per minute for a single repo) so 300/min
# is well above legitimate traffic. The burst of 100
# covers a force-push fan-out that lands N webhooks at
# once. The rate-limit is at the Traefik layer, so 429s
# never reach the receiver — HMAC validation cost on a
# hostile flood stays at zero, and the receiver's
# process-level limiter (M4) only matters if the Traefik
# limit is bypassed.
#
# The rateLimit plugin uses the in-memory bucket. Traefik
# is a single instance in this cluster so the state is
# authoritative. If the deploy ever multi-instances
# Traefik, swap to a redis backend — the migration is
# config-only.
#
# body-limit is the buffering middleware's maxRequestBodyBytes.
# 64 KB is well above any real webhook (a GitHub payload
# with a fat PR diff) and well below DoS territory. Traefik
# returns 413 on overflow.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-api
  namespace: dev-tools
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 60
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-dashboard
  namespace: dev-tools
spec:
  rateLimit:
    average: 30
    period: 1m
    burst: 30
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-webhook
  namespace: dev-tools
spec:
  rateLimit:
    average: 300
    period: 1m
    burst: 100
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit
  namespace: dev-tools
spec:
  buffering:
    maxRequestBodyBytes: 65536
