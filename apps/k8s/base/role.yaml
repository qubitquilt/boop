---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: boop-receiver
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  # ConfigMap read access so the receiver can pick up JOB_IMAGE
  # changes from the boop-config ConfigMap at runtime, instead of
  # baking the digest into the receiver image or relying on a
  # restart to pick up ArgoCD-driven updates. The receiver reads
  # the ConfigMap on each Job submit and falls back to the env
  # value (set at startup from the same ConfigMap) if the read
  # fails. create/update/delete are intentionally NOT granted —
  # the receiver never mutates its own config.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: boop-receiver
subjects:
  - kind: ServiceAccount
    name: boop-receiver
    namespace: dev-tools
roleRef:
  kind: Role
  name: boop-receiver
  apiGroup: rbac.authorization.k8s.io
