---
# QUB-101: daily backup of the receiver's SQLite store.
#
# The receiver's data PVC is ReadWriteOnce, so a separate
# CronJob cannot mount it directly while the receiver Pod
# holds it. The default production setup is the in-process
# backup loop wired into the receiver (see deployment.yaml
# env vars BACKUP_DIR / BACKUP_EVERY / BACKUP_KEEP plus the
# boop-receiver-backups PVC defined in the same file).
#
# This manifest is the alternative pattern for clusters
# where the operator wants a separate Job driving the backup
# (e.g. S3 via rclone, or a cluster with RWX-capable
# storage where the Job can mount both volumes directly).
#
# Two variants are documented below; pick the one that
# matches your storage topology. Both share the same
# retention policy (last 30 daily snapshots).
#
# NOTE: This file is intentionally NOT referenced from
# kustomization.yaml. The in-process backup loop in the
# receiver is the default and works on every cluster. Copy
# the relevant resources into your overlay if you want to
# enable a separate Job-driven backup.
#
# Variant A — kubectl exec into the receiver Pod (RWO safe)
#   The CronJob runs rclone from a small image and asks the
#   receiver to write today's snapshot via an exec call.
#   Requires a ServiceAccount bound to a Role granting
#   pods/exec on the receiver's namespace.
#
# Variant B — shared /backups volume (RWX only)
#   The CronJob mounts BOTH the receiver's data PVC (R/O)
#   and a shared backups PVC, runs sqlite3 .backup, and
#   prunes. Requires the data PVC to allow ReadOnlyMany
#   mounts in parallel with the receiver's R/W mount, which
#   most CSI drivers do not support on RWO PVCs.

