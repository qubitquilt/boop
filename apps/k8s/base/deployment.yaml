---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boop-receiver-data
  labels:
    app: boop-receiver
  annotations:
    # QUB-101: Retain on PVC delete so a `kubectl delete pvc`
    # (or the namespace being torn down for migration) does not
    # zero the volume by accident. The PV goes to "Released"
    # instead of being deleted, and an operator can re-bind it
    # or copy /data/boop.db out. The annotation works on
    # StorageClasses that propagate reclaim policy from the
    # PVC; the spec field below is the canonical way on
    # clusters >= 1.31 and is silently ignored elsewhere.
    # Reclaim policy is the layer that protects against
    # accidental data loss; the daily backup loop (see
    # backup-cronjob.yaml for the Job-driven alternative)
    # is what protects against actual disk loss.
    pv.kubernetes.io/reclaim-policy: Retain
spec:
  accessModes:
    - ReadWriteOnce
  # 1Gi is plenty for the dashboard's run history. At one row
  # per review (a few KB) plus a telemetry row (a few hundred
  # bytes), 1Gi holds hundreds of thousands of runs before
  # any operator needs to think about growth. Resize is
  # in-place (StorageClass permitting); bumping is a one-line
  # change here, no consumer needs an update.
  #
  # The retention loop (DB_RETENTION, default 365d) and the
  # incremental vacuum (DB_VACUUM_INTERVAL, default 7d) keep
  # actual usage well below the 1Gi ceiling; the 2.5 KB/review
  # estimate in the comment was right, but a busy 1k-PR
  # monorepo day at ~2.5 MB/day fills 1Gi inside a year
  # without retention. The daily backup (BACKUP_EVERY, default
  # 24h; BACKUP_KEEP, default 30) lands in the separate
  # boop-receiver-backups PVC, so the absolute floor for "no
  # data loss" is one day between backups.
  resources:
    requests:
      storage: 1Gi
  # QUB-101: prefer the cluster's default provisioner unless
  # the overlay sets a non-default. The overlay wires a
  # specific StorageClass (e.g. local-path on bare metal).
  #
  # Reclaim policy is set via the annotation above. The
  # spec.persistentVolumeReclaimPolicy field (K8s 1.31+)
  # would be canonical but is omitted: ArgoCD's bundled
  # OpenAPI schema pre-dates the field and rejects
  # server-side-apply patches with
  # ".spec.persistentVolumeReclaimPolicy: field not declared
  # in schema". The annotation is portable across all
  # supported K8s versions.

---
# QUB-101: separate PVC for daily backup snapshots. The
# receiver mounts this at /backups and writes one VACUUM
# INTO file per day. Sized for 30 daily snapshots at peak
# (50MiB each is generous): 2Gi covers the worst case with
# headroom. Retain on delete, same reasoning as the data
# PVC: an accidental `kubectl delete pvc` should not nuke
# the only copies of the database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boop-receiver-backups
  labels:
    app: boop-receiver
  annotations:
    pv.kubernetes.io/reclaim-policy: Retain
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # Reclaim policy is set via the annotation above; the
  # spec.persistentVolumeReclaimPolicy field (K8s 1.31+)
  # is omitted for the same ArgoCD schema reason as the
  # data PVC above.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boop-receiver
  labels:
    app: boop-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boop-receiver
  template:
    metadata:
      labels:
        app: boop-receiver
    spec:
      serviceAccountName: boop-receiver
      containers:
        - name: receiver
          image: ghcr.io/qubitquilt/boop-receiver:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: boop-config
                  key: LOG_LEVEL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: boop-config
                  key: PORT
            - name: JOB_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: boop-config
                  key: JOB_IMAGE
            - name: TARGET_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: boop-config
                  key: TARGET_NAMESPACE
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: boop-secrets
                  key: WEBHOOK_SECRET
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: boop-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: boop-secrets
                  key: GITHUB_APP_PRIVATE_KEY
            - name: BOT_LOGIN
              value: "BoopPr[bot]"
            # Data layer: where the SQLite file lives. The
            # /data volume is the PVC below. The file is
            # created on first run; the schema migrates
            # automatically.
            - name: DB_PATH
              value: /data/boop.db
            # QUB-101: retention knobs. All optional — the
            # receiver falls back to sensible defaults
            # (365d retention, 5m cleanup, 7d vacuum) when
            # the env var is unset or unparseable.
            - name: DB_RETENTION
              value: "8760h"   # 365 days
            - name: DB_CLEANUP_INTERVAL
              value: "5m"
            - name: DB_VACUUM_INTERVAL
              value: "168h"    # 7 days
            # QUB-101: backup knobs. BACKUP_DIR is the
            # destination directory; default /backups
            # matches the volumeMount below. Empty value
            # disables the loop (useful for tests).
            - name: BACKUP_DIR
              value: /backups
            - name: BACKUP_EVERY
              value: "24h"
            - name: BACKUP_KEEP
              value: "30"
            # Shared secret for the runner's POST endpoints.
            # Generated once on first deploy and stored in the
            # boop-secrets Secret; the Job template below
            # passes it through to the runner. A missing
            # value rejects every runner POST (so a forgotten
            # secret is loud, not silent).
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: boop-secrets
                  key: RUNNER_TOKEN
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            # QUB-101: separate volume for daily backups.
            # The receiver writes one VACUUM INTO snapshot
            # per day to this mount.
            - name: backups
              mountPath: /backups
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: boop-receiver-data
        - name: backups
          persistentVolumeClaim:
            claimName: boop-receiver-backups
---
apiVersion: v1
kind: Service
metadata:
  name: boop-receiver
  labels:
    app: boop-receiver
spec:
  type: ClusterIP
  selector:
    app: boop-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
