name: build-runner

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/runner/**'
      - '.github/workflows/build-runner.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/runner/**'
      - '.github/workflows/build-runner.yaml'
  # QUB-122: nightly self-heal. The `rebuild-runner-nightly` workflow
  # calls `gh workflow run build-runner --ref main` on a cron. Manual
  # dispatch from the Actions tab also lands here — useful for a
  # forced rebuild when a base image (e.g. `ubuntu:24.04`) is known
  # to have a CVE but the source tree is unchanged. The push path
  # filter does not apply to workflow_dispatch, so this runs even
  # when `apps/runner/**` has not changed — which is the whole point
  # of the self-heal (a fix to any other path leaves the runner
  # image behind until the next push, by design).
  workflow_dispatch:

env:
  IMAGE: ghcr.io/qubitquilt/boop-runner

jobs:
  # QUB-136: the runner is now TypeScript. The build job requires
  # the test job to pass so a broken typecheck or test never lands
  # in :stable and the next K8s Job (which pulls the digest) can't
  # start on a runner that won't run. The receiver picks the digest
  # up from the ConfigMap pin written by sync-image-digests, so
  # gating the build here is the load-bearing correctness check for
  # the migration. bun is the hot path (matches Makefile test);
  # node --test --experimental-strip-types is the parity run the
  # acceptance criteria pins.
  test:
    # QUB-136: run the test gate on every PR, including forks. A
    # fork PR cannot push to GHCR (the `push:` flag below gates on
    # event != pull_request) so a fork cannot ship a green build,
    # but a fork CAN carry a typecheck regression and a maintainer
    # who squashes the merge would land a broken build. Running
    # tests on forks surfaces the regression in the PR view.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.21.1'
      - name: Install
        working-directory: apps/runner
        # `bun install --frozen-lockfile` reads bun.lock (Bun's
        # native lockfile format) and refuses to mutate it. The
        # install path produces the same `node_modules/` layout
        # `npm ci` produces from package-lock.json, so
        # `npm prune --production` in the Dockerfile still works.
        # We commit both bun.lock (for the Bun-based install) and
        # package-lock.json (for any npm-based consumer + tooling
        # that reads it) — they're regenerated together via
        # `bun install` so the resolved tree is identical.
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/runner
        run: bun run typecheck
      - name: Build
        working-directory: apps/runner
        run: bun run build
      - name: Test (bun)
        working-directory: apps/runner
        run: bun test
      - name: Test (node --test --experimental-strip-types)
        working-directory: apps/runner
        # Parity run on node 22 — the production runtime. If the
        # two diverge, a future refactor that depends on bun-only
        # behavior surfaces here before it lands in :stable.
        run: npm run test:node

  build:
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: boop-runner-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: kubernetes
          driver-opts: |
            namespace=buildx-builder
            loadbalance=sticky


      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable
          flavor: latest=auto

      # QUB-114: scope the GHA cache per ref so a PR build cannot
      # invalidate the main cache (and vice-versa). Refs can contain
      # `/`, which is not legal in a cache scope, so substitute `-`.
      - name: Compute cache scope
        id: scope
        run: |
          if [ -n "${{ github.event.pull_request.head.ref }}" ]; then
            REF="${{ github.event.pull_request.head.ref }}"
          else
            REF="${{ github.ref_name }}"
          fi
          SCOPE="runner-${REF//\//-}"
          echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/runner
          platforms: linux/arm64
          # QUB-122: `!= pull_request` rather than `== push` so the
          # `rebuild-runner-nightly` `workflow_dispatch` (and any
          # manual Actions-tab dispatch) actually pushes to GHCR.
          # The old `== push` guard silently turned a dispatch into
          # a cache-warmed local build that never landed a new
          # `:stable` digest. `pull_request` is the only event where
          # the guard should be false (PR builds are smoke tests
          # and fork PRs cannot push anyway).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # QUB-114: BUILDKIT_INLINE_CACHE=1 makes the `mode=max` cache
          # export carry layer metadata so downstream `--cache-from` can
          # reuse intermediate layers instead of only the final layer.
          build-args: BUILDKIT_INLINE_CACHE=1
          cache-from: type=gha,scope=${{ steps.scope.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.scope.outputs.scope }}
