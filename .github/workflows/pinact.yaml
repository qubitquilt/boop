name: pinact

# CI guard: every GitHub Actions reference must be pinned to a
# full commit SHA, not a tag or branch. Tags are mutable: an
# attacker who compromises an action's tag namespace can swap the
# bytes behind the tag without changing the manifest. SHAs are
# immutable by definition.
#
# pinact (`suzuki-shunsuke/pinact`) reads every workflow under
# .github/workflows/ and fails the run if any `uses:` line is
# not pinned to a 40-character SHA. The fix is mechanical —
# `pinact run` rewrites the file in place — and well-tested in
# other repos, so we run it on every PR that touches a workflow.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  pinact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run pinact
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        # pinact-action v3 dropped the `args:` input. The action
        # defaults `fix: true` (which auto-rewrites workflow files
        # and opens a PR) — we want read-only, so we must set
        # `fix: false` explicitly. `no_api: true` is incompatible
        # with `fix: true` (auto-rewriting requires the GitHub API
        # to open a follow-up PR), so we set both flags together.
        # The run itself fails when an unpinned action lands, which
        # surfaces the issue in the PR view; the operator runs
        # `pinact run --fix` locally to land the rewrite.
        with:
          fix: false
          no_api: true
