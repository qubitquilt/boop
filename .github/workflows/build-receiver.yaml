name: build-receiver

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'apps/k8s/**'
      - '.github/workflows/sync-image-digests.yaml'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'apps/k8s/**'
      - '.github/workflows/sync-image-digests.yaml'
      - 'docs/**'

env:
  IMAGE: ghcr.io/qubitquilt/boop-receiver

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: boop-runner-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: kubernetes
          driver-opts: |
            namespace=buildx-builder
            loadbalance=sticky


      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable
          flavor: latest=auto

      # QUB-114: scope the GHA cache per ref so a PR build cannot
      # invalidate the main cache (and vice-versa). Refs can contain
      # `/`, which is not legal in a cache scope, so substitute `-`.
      - name: Compute cache scope
        id: scope
        run: |
          if [ -n "${{ github.event.pull_request.head.ref }}" ]; then
            REF="${{ github.event.pull_request.head.ref }}"
          else
            REF="${{ github.ref_name }}"
          fi
          SCOPE="receiver-${REF//\//-}"
          echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/receiver
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          # QUB-114: BUILDKIT_INLINE_CACHE=1 makes the `mode=max` cache
          # export carry layer metadata so downstream `--cache-from` can
          # reuse intermediate layers instead of only the final layer.
          build-args: BUILDKIT_INLINE_CACHE=1
          cache-from: type=gha,scope=${{ steps.scope.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.scope.outputs.scope }}
