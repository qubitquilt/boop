name: sync-image-digests

# After a successful build, query the registry for the current :stable
# digest of each image and open a PR that updates the kustomize
# overlay and the runner-image ConfigMap so the next ArgoCD sync
# pins the Deployment / Job template to the bytes that were just
# built. Without this, K8s never rolls the Deployment on a
# registry-only image change (the :stable tag is the same string
# in git). The PR is opened instead of pushing directly to main so
# the repo's "changes must be made through a pull request" branch
# protection rule is satisfied. The squash merge produces a commit
# on main signed by the human merger, which satisfies the
# required_signatures rule; the bot's intermediate commit on the
# feature branch is not signed (debugging bot-side SSH signing
# produced inconsistent signatures and was abandoned in favor of
# this flow).
#
# C2 (security review): the receiver image is already
# digest-pinned via the kustomize `images:` block, but the runner
# image lived in the boop-config ConfigMap as a mutable :stable
# tag. A compromised `packages: write` could re-tag :stable and
# the next Job would run attacker code with the GitHub App's
# installation token and the OpenRouter API key. The runner block
# below resolves :stable -> sha256:... and writes the digest into
# the ConfigMap's JOB_IMAGE value, then opens a PR to commit the
# pin.
#
# Coalescing: build-receiver and build-runner both trigger this
# workflow, and the two upstream builds often complete within a
# few seconds of each other on the same push to main. The dedupe
# below picks up the open sync PR's branch (if any) and pushes any
# new digest changes to that branch instead of opening a parallel
# PR — so a single PR always carries every digest update for the
# cycle, and no digest update is silently dropped on the floor.

on:
  workflow_run:
    workflows: [build-receiver, build-runner]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: sync-image-digests
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve current receiver + runner digests
        id: digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Resolve the digest via the GitHub packages API rather than
          # docker buildx imagetools — the runner may not be able to
          # authenticate against ghcr.io without an explicit login,
          # and the API works for any runner with packages:read.
          for IMAGE_NAME in boop-receiver boop-runner; do
            VERSION_ID="$(
              gh api "/orgs/qubitquilt/packages/container/${IMAGE_NAME}/versions" \
                --jq '.[] | select(.metadata.container.tags[]? == "stable") | .id' \
                | head -1
            )"
            if [ -z "${VERSION_ID}" ]; then
              echo "::error::No :stable version found for ${IMAGE_NAME}"
              exit 1
            fi
            DIGEST="$(
              gh api "/orgs/qubitquilt/packages/container/${IMAGE_NAME}/versions/${VERSION_ID}" \
                --jq '.name'
            )"
            if [ -z "${DIGEST}" ]; then
              echo "::error::No digest returned for ${IMAGE_NAME} version ${VERSION_ID}"
              exit 1
            fi
            echo "${IMAGE_NAME}=${DIGEST}" >> "${GITHUB_OUTPUT}"
          done

      # Pick the branch we're going to commit to. If an earlier run
      # in this cycle already opened a sync PR, reuse that branch so
      # the new push is a follow-up commit on the same PR. Otherwise
      # create a fresh branch. Either way, the in-tree files at the
      # end of this step match the branch we want to push to.
      - name: Pick branch (existing sync PR or new)
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING_JSON="$(
            gh pr list --state open --json number,headRefName \
              --jq '[.[] | select(.headRefName | startswith("chore/sync-image-digests-"))] | .[0] // empty'
          )"
          if [ -n "${EXISTING_JSON}" ]; then
            EXISTING_NUM="$(echo "${EXISTING_JSON}" | jq -r '.number')"
            EXISTING_BRANCH="$(echo "${EXISTING_JSON}" | jq -r '.headRefName')"
            echo "Open sync PR #${EXISTING_NUM} (branch ${EXISTING_BRANCH}); appending any new digest changes to that branch."
            git fetch --no-tags --depth=1 origin "${EXISTING_BRANCH}"
            git checkout "${EXISTING_BRANCH}"
            echo "branch=${EXISTING_BRANCH}" >> "${GITHUB_OUTPUT}"
            echo "pr_number=${EXISTING_NUM}" >> "${GITHUB_OUTPUT}"
            echo "is_update=true" >> "${GITHUB_OUTPUT}"
          else
            BRANCH="chore/sync-image-digests-${{ github.run_id }}"
            git checkout -b "${BRANCH}"
            echo "branch=${BRANCH}" >> "${GITHUB_OUTPUT}"
            echo "pr_number=" >> "${GITHUB_OUTPUT}"
            echo "is_update=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Update overlay + ConfigMap digests
        env:
          RECEIVER_DIGEST: ${{ steps.digests.outputs.boop-receiver }}
          RUNNER_DIGEST: ${{ steps.digests.outputs.boop-runner }}
        run: |
          set -euo pipefail
          pip install --quiet ruamel.yaml
          python3 - <<'PY'
          import os
          from ruamel.yaml import YAML

          yaml = YAML()
          yaml.preserve_quotes = True
          # Re-emit the file in the same shape it was committed in:
          # 2-space mapping indent, 4-space sequence dash, 2-space
          # content offset. Defaults drop the dashes to column 0
          # and the inner `digest:` line lands one column too far
          # left, which produces a multi-line diff on every run.
          yaml.indent(mapping=2, sequence=4, offset=2)
          # Preserve the `---` document start marker.
          yaml.explicit_start = True
          # Long digests would otherwise wrap onto a new line.
          yaml.width = 4096

          overlay = "apps/k8s/overlays/pugquilt/kustomization.yaml"
          with open(overlay) as f:
              data = yaml.load(f)
          for img in data.get("images", []):
              if img["name"] == "ghcr.io/qubitquilt/boop-receiver":
                  img["digest"] = os.environ["RECEIVER_DIGEST"]
          with open(overlay, "w") as f:
              yaml.dump(data, f)

          # The runner image lives in the boop-config ConfigMap, not
          # in a kustomize image override, so it cannot be pinned
          # via the same images: block. Rewrite the JOB_IMAGE
          # value to embed the digest directly in the tag
          # (image@sha256:... is the canonical immutable ref form).
          config = "apps/k8s/base/config.yaml"
          with open(config) as f:
              cfg = yaml.load(f)
          runner_digest = os.environ["RUNNER_DIGEST"]
          # Preserve the existing comment block above JOB_IMAGE.
          # The receiver reads JOB_IMAGE verbatim and passes it to
          # the K8s API; K8s accepts both `repo:tag@digest` and
          # `repo@digest`. We use the latter so the manifest does
          # not show a stale `:stable` string next to the digest.
          if "data" in cfg and "JOB_IMAGE" in cfg["data"]:
              cfg["data"]["JOB_IMAGE"] = f"ghcr.io/qubitquilt/boop-runner@{runner_digest}"
          with open(config, "w") as f:
              yaml.dump(cfg, f)
          PY

      - name: Commit, push, and (re-)enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet apps/k8s/overlays/pugquilt/kustomization.yaml apps/k8s/base/config.yaml; then
            echo "No digest changes since the last sync PR; nothing to push."
            exit 0
          fi

          BRANCH="${{ steps.pick.outputs.branch }}"
          IS_UPDATE="${{ steps.pick.outputs.is_update }}"
          PR_NUMBER="${{ steps.pick.outputs.pr_number }}"

          git config user.name "qubit-quilt-agent"
          git config user.email "233101448+qubit-quilt-agent@users.noreply.github.com"
          git add apps/k8s/overlays/pugquilt/kustomization.yaml apps/k8s/base/config.yaml
          git commit -m "chore(deps): update image digests"
          git push origin "${BRANCH}"

          if [ "${IS_UPDATE}" = "false" ]; then
            gh pr create \
              --title "chore(deps): update image digests" \
              --body "Auto-generated by the sync-image-digests workflow. Squash-merge to apply; the merge commit on main will be signed by the human merger." \
              --base main \
              --head "${BRANCH}" \
              --label skip-review \
              --assignee qubit-quilt-agent

            CREATED_PR="$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number')"
            if [ -z "${CREATED_PR}" ]; then
              echo "::error::PR was not created for branch ${BRANCH}"
              exit 1
            fi

            # Try to enable auto-merge. Requires the repo to have
            # auto-merge enabled in settings; if it isn't, the PR
            # stays open for manual review and merge.
            if gh pr merge "${CREATED_PR}" --auto --squash; then
              echo "Auto-merge enabled for PR #${CREATED_PR}."
            else
              echo "Auto-merge not available; PR #${CREATED_PR} needs a manual merge."
            fi
          else
            # The new push reset the PR's required-checks state, so
            # we re-arm auto-merge. Failure here is non-fatal — the
            # PR is still updated, just without auto-merge.
            if gh pr merge "${PR_NUMBER}" --auto --squash; then
              echo "Auto-merge re-enabled for existing PR #${PR_NUMBER}."
            else
              echo "::warning::Auto-merge not re-enabled for PR #${PR_NUMBER}; needs a manual merge."
            fi
          fi