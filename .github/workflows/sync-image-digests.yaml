name: sync-image-digests

# After a successful build, query the registry for the current :latest
# digest of each image and open a PR that updates the kustomize overlay
# so the next ArgoCD sync pins the Deployment to the bytes that were
# just built. Without this, K8s never rolls the Deployment on a
# registry-only image change (the :latest tag is the same string in
# git). The PR is opened instead of pushing directly to main so the
# repo's "changes must be made through a pull request" branch
# protection rule is satisfied; auto-merge is enabled if the repo
# allows it.

on:
  workflow_run:
    workflows: [build-receiver, build-runner]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  pull-requests: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve current receiver digest
        id: digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Resolve the digest via the GitHub packages API rather than
          # docker buildx imagetools — the runner may not be able to
          # authenticate against ghcr.io without an explicit login,
          # and the API works for any runner with packages:read.
          RESPONSE="$(
            gh api /orgs/qubitquilt/packages/container/boop-receiver/versions \
              --jq '.[] | select(.metadata.container.tags[]? == "latest") | .id' \
              2>&1
          )"
          RC=$?
          echo "::debug::API response (rc=${RC}): ${RESPONSE}"
          VERSION_ID="$(printf '%s' "${RESPONSE}" | head -1)"
          if [ -z "${VERSION_ID}" ]; then
            echo "::error::No :latest version found for boop-receiver"
            exit 1
          fi
          DIGEST="$(
            gh api "/orgs/qubitquilt/packages/container/boop-receiver/versions/${VERSION_ID}" \
              --jq '.name'
          )"
          if [ -z "${DIGEST}" ]; then
            echo "::error::No digest returned for version ${VERSION_ID}"
            exit 1
          fi
          echo "boop-receiver=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Update overlay digest
        env:
          RECEIVER_DIGEST: ${{ steps.digests.outputs.boop-receiver }}
        run: |
          set -euo pipefail
          pip install --quiet ruamel.yaml
          python3 - <<'PY'
          import os
          from ruamel.yaml import YAML

          yaml = YAML()
          yaml.preserve_quotes = True
          # Re-emit the file in the same shape it was committed in:
          # 2-space mapping indent, 4-space sequence dash, 2-space
          # content offset. Defaults drop the dashes to column 0
          # and the inner `digest:` line lands one column too far
          # left, which produces a multi-line diff on every run.
          yaml.indent(mapping=2, sequence=4, offset=2)
          # Preserve the `---` document start marker.
          yaml.explicit_start = True
          # Long digests would otherwise wrap onto a new line.
          yaml.width = 4096
          path = "apps/k8s/overlays/pugquilt/kustomization.yaml"
          with open(path) as f:
              data = yaml.load(f)

          for img in data.get("images", []):
              if img["name"] == "ghcr.io/qubitquilt/boop-receiver":
                  img["digest"] = os.environ["RECEIVER_DIGEST"]

          with open(path, "w") as f:
              yaml.dump(data, f)
          PY

      - name: Open PR with digest update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet apps/k8s/overlays/pugquilt/kustomization.yaml; then
            echo "No digest changes; nothing to do."
            exit 0
          fi

          BRANCH="chore/sync-image-digests-${{ github.run_id }}"
          git checkout -b "${BRANCH}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/k8s/overlays/pugquilt/kustomization.yaml
          git commit -m "chore(deps): update image digests"
          git push --set-upstream origin "${BRANCH}"

          gh pr create \
            --title "chore(deps): update image digests" \
            --body "Auto-generated by the sync-image-digests workflow." \
            --base main \
            --head "${BRANCH}"

          PR_NUMBER="$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number')"
          if [ -z "${PR_NUMBER}" ]; then
            echo "::error::PR was not created"
            exit 1
          fi

          # Try to enable auto-merge. Requires the repo to have
          # auto-merge enabled in settings; if it isn't, the PR
          # stays open for manual review and merge.
          if gh pr merge "${PR_NUMBER}" --auto --squash; then
            echo "Auto-merge enabled for PR #${PR_NUMBER}."
          else
            echo "Auto-merge not available; PR #${PR_NUMBER} needs a manual merge."
          fi
